<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maqna Postnote</title>
  <link rel="icon" href="https://i.postimg.cc/6qyL5M8T/logo-favicon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f0f2f5;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      scrolling="yes"
      allowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-write;">
    </iframe>
  </div>

  <script>
    (function() {
      const baseUrl = "https://script.google.com/macros/s/AKfycbyWiOIh08hL2oX1qt1pdoHSReK6kKlOEgVRPkfDM6OK2Q8eO74J2U_pScb0RXyJ7bmc_A/exec?mode=view";
      const currentParams = window.location.search;
      document.getElementById('app').src = baseUrl + currentParams;
    })();
  </script>
</body>
</html>
